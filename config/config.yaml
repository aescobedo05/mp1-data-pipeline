validation:
  required_columns:
    - record_id
    - name
    - rating
    - category
    - status
  numeric_columns:
    - record_id
    - rating

processing:
  remove_duplicates: true

  missing:
    enabled: true
    axis: "rows"

  outliers:
    enabled: true
    columns:
      - record_id
      - rating
    method: "iqr"
    threshold: 1.5
